<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Trail Strength — 40+</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trail Strength">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#171717;--muted:#707070;--line:#e7e7e2;--accent:#111;--soft:#ededeb;--done:#dce9df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button{font:inherit;border:0;cursor:pointer} .app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 34px}
header{padding:8px 2px 18px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}.title{font-size:32px;line-height:1.05;font-weight:800;margin:7px 0}.subtitle{color:var(--muted);font-size:14px}
.hero{background:var(--accent);color:#fff;border-radius:24px;padding:22px;margin-bottom:16px}.heroTop{display:flex;justify-content:space-between;align-items:flex-start}.hero h2{margin:0;font-size:23px}.pill{background:#2a2a2a;padding:7px 10px;border-radius:999px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:24px;gap:10px}.stat{background:#1f1f1f;border-radius:14px;padding:12px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#aaa}
.primary{width:100%;background:#fff;color:#111;border-radius:14px;padding:14px;margin-top:16px;font-weight:800}.sectionTitle{font-size:15px;font-weight:800;margin:20px 2px 10px}.block{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:9px 0;overflow:hidden}.blockHead{display:flex;align-items:center;justify-content:space-between;padding:15px}.blockHead strong{font-size:15px}.blockHead small{color:var(--muted)}.exercises{border-top:1px solid var(--line)}.exercise{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);align-items:center}.exercise:last-child{border-bottom:0}.num{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}.exercise.done{background:#f7faf7}.exercise.done .num{background:var(--done)}.exName{font-weight:700;font-size:14px;flex:1}.meta{font-size:12px;color:var(--muted);margin-top:3px}.arrow{color:#aaa}.screen{display:none}.screen.active{display:block}.topbar{display:flex;align-items:center;gap:10px;margin:4px 0 16px}.back{background:var(--soft);width:38px;height:38px;border-radius:12px}.progress{height:5px;background:#ddd;border-radius:5px;overflow:hidden;flex:1}.progress i{display:block;height:100%;background:#111;width:0}.counter{font-size:12px;color:var(--muted);font-weight:700}.focus{background:#111;color:#fff;border-radius:24px;padding:24px}.focus .tag{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.1em;font-weight:700}.focus h1{font-size:28px;margin:8px 0}.dose{font-size:18px;font-weight:700}.note{background:#202020;border-radius:15px;padding:14px;margin-top:18px;color:#ddd;font-size:14px;line-height:1.45}.timer{font-variant-numeric:tabular-nums;font-size:58px;text-align:center;font-weight:800;margin:24px 0 12px}.timerLabel{text-align:center;color:#aaa;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.controls{display:flex;gap:10px}.controls button{flex:1;padding:14px;border-radius:14px;font-weight:800}.secondary{background:#303030;color:#fff}.complete{background:#fff;color:#111}.video{display:block;text-align:center;margin-top:14px;padding:12px;border:1px solid #444;border-radius:12px;color:#fff;text-decoration:none;font-size:13px}.footerBtns{display:flex;gap:10px;margin-top:14px}.footerBtns button{flex:1;padding:15px;border-radius:14px;font-weight:800}.hidden{display:none}

.homeActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.homeAction{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;text-align:left}.homeAction b{display:block;font-size:14px}.homeAction span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.exerciseInfo{margin-top:14px;background:#f7f7f4;border-radius:14px;padding:12px}.weightRow{display:flex;align-items:center;gap:10px;margin-top:12px}.weightRow label{font-size:12px;color:#666;flex:1}.weightRow input{width:100px;border:1px solid #ddd;border-radius:10px;padding:9px;background:#fff;font-weight:700}.rest{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:12px;border-radius:14px;background:#252525}.rest b{font-size:15px}.rest button{background:#fff;color:#111;border-radius:10px;padding:8px 12px;font-weight:800}.history{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.historyRow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.historyRow:last-child{border-bottom:0}.empty{color:#777;font-size:13px}.toast{position:fixed;left:16px;right:16px;bottom:18px;background:#111;color:#fff;border-radius:14px;padding:13px 15px;text-align:center;font-size:13px;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:none}

.demoBox{height:190px;background:linear-gradient(145deg,#202020,#111);border-radius:18px;margin-top:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.demoIcon{font-size:68px;opacity:.9}.demoLabel{position:absolute;bottom:10px;left:12px;right:12px;font-size:11px;color:#aaa;text-align:center}.setGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.setBtn{background:#303030;color:#aaa;border-radius:12px;padding:11px 4px;font-size:12px;font-weight:800}.setBtn.done{background:#fff;color:#111}.setBtn.active{outline:2px solid #fff;color:#fff}.repInput{width:75px;background:#303030;color:#fff;border:1px solid #444;border-radius:10px;padding:9px;text-align:center;font-weight:700}.logRow{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.autoRest{display:flex;gap:8px;margin-top:10px}.autoRest button{flex:1;background:#303030;color:#fff;padding:10px;border-radius:10px;font-weight:700}.sectionDivider{margin:18px 0 8px;border-top:1px solid #333;padding-top:14px;color:#aaa;font-size:11px;text-transform:uppercase;letter-spacing:.1em}
</style>
</head>
<body>
<div class="app">
  <div id="home" class="screen active">
    <header><div class="eyebrow">Trail Running</div><div class="title">Strength 40+</div><div class="subtitle">Seu treino de fortalecimento, guiado passo a passo.</div></header>
    <section class="hero">
      <div class="heroTop"><div><div class="eyebrow" style="color:#aaa">Sessão</div><h2>Fortalecimento</h2></div><div class="pill">2× / semana</div></div>
      <div class="stats"><div class="stat"><b>~50 min</b><span>Duração</span></div><div class="stat"><b>5 blocos</b><span>Estrutura</span></div></div>
      <button class="primary" onclick="startWorkout()">▶ Iniciar treino</button>
    </section>
    <div class="homeActions">
      <button class="homeAction" onclick="showHistory()"><b>📈 Histórico</b><span>Cargas e sessões</span></button>
      <button class="homeAction" onclick="resetWorkout()"><b>↺ Nova sessão</b><span>Limpar progresso atual</span></button>
    </div>
    <div id="historyScreen" class="hidden"></div>
    <div class="sectionTitle">Estrutura</div>
    <div id="blocks"></div>
  </div>

  <div id="workout" class="screen">
    <div class="topbar"><button class="back" onclick="showHome()">‹</button><div class="progress"><i id="progress"></i></div><div class="counter" id="counter"></div></div>
    <section class="focus">
      <div class="tag" id="blockName"></div>
      <h1 id="exName"></h1>
      <div class="dose" id="dose"></div>

      <div class="demoBox" id="demoBox">
        <div class="demoIcon" id="demoIcon">🏃</div>
        <div class="demoLabel" id="demoLabel">Demonstração visual do movimento</div>
      </div>
      <a class="video" id="video" target="_blank" rel="noopener">Abrir demonstração completa ↗</a>

      <div class="sectionDivider">Séries</div>
      <div class="setGrid" id="setGrid"></div>

      <div class="logRow">
        <label style="font-size:12px;color:#aaa">Carga utilizada</label>
        <input class="repInput" id="weight" type="number" inputmode="decimal" min="0" step="0.5" placeholder="kg" onchange="saveWeight()">
      </div>
      <div class="logRow">
        <label style="font-size:12px;color:#aaa">Repetições realizadas</label>
        <input class="repInput" id="repsDone" type="number" inputmode="numeric" min="0" placeholder="reps" onchange="saveReps()">
      </div>

      <div class="rest">
        <b id="restText">Descanso sugerido</b>
        <button onclick="startRest()">Iniciar descanso</button>
      </div>

      <div class="timer" id="timer">00:00</div>
      <div class="timerLabel" id="timerLabel">Pronto</div>
      <div class="controls">
        <button class="secondary" onclick="toggleTimer()" id="timerBtn">▶ Timer</button>
        <button class="complete" onclick="completeExercise()">✓ Concluir exercício</button>
      </div>
    </section>
    <div class="footerBtns"><button class="secondary" onclick="prevExercise()">← Anterior</button><button class="complete" onclick="nextExercise()">Próximo →</button></div>
  </div>
</div><div id="toast" class="toast"></div>
<script>
const blocks=[
{name:"Aquecimento dinâmico",time:"7 min",items:[
["Marcha com elevação de joelho","30s","", "https://planfit.ai/en/exercise/marching-on-spot"],
["Chute no glúteo (butt kicks)","30s","", "https://gymkee.com/exercises/cardio/butt-kicks/"],
["Balanço de perna à frente/trás e lateral","10 cada perna, cada direção","", "https://nielasher.com/blogs/strength-and-conditioning/leg-swings"],
["Agachamento com rotação de tronco","8 reps","", "https://redefiningstrength.com/?p=14400"],
["Avanço caminhando (adicione torção de tronco)","8 cada perna","", "https://planfit.ai/walking-lunge-vs-side-lunge"],
["Prancha com toque de ombro","10 cada lado","", "https://planfit.ai/en/exercise/shoulder-tap"]]},
{name:"1. Ativação de glúteos",time:"8 min",items:[
["Ostra (clamshell)","15 cada lado","Quadril sempre alinhado, sem rodar o tronco","https://planfit.ai/en/exercise/clamshell"],
["Elevação lateral de perna deitado","15 cada lado","Perna reta, movimento lento","https://planfit.ai/en/exercise/hip-abduction"],
["Caminhada de agachamento lateral (monster walk)","10 passos cada direção","Sem faixa: joelhos apontando para fora e quadril baixo","https://planfit.ai/en/exercise/band-lateral-walk"],
["Ponte de glúteo unilateral marchando","12 cada perna","Quadril nivelado o tempo todo","https://www.exercise.com/exercises/glute-bridge-march/"],
["Bird-dog","10 cada lado","Controle, sem deixar o quadril cair","https://planfit.ai/en/exercise/bird-dog"]]},
{name:"2. Força principal",time:"16 min",items:[
["Agachamento goblet (halter/kettlebell)","3×10","Tempo 2-1-2, cotovelos dentro dos joelhos na base","https://planfit.ai/en/exercise/goblet-squat"],
["Afundo búlgaro com halteres","3×8 cada perna","Pé de trás elevado no step; não deixe o joelho da frente cair para dentro","https://planfit.ai/en/exercise/dumbbell-bulgarian-split-squat"],
["Levantamento terra romeno unilateral com halteres","3×8 cada perna","Quadril nivelado; trabalha posterior de coxa e equilíbrio","https://www.exercise.com/exercises/single-leg-romanian-deadlift/"],
["Subida no step com halteres","3×8 cada perna","Simula subida de trilha; empurre com o calcanhar","https://planfit.ai/en/exercise/dumbbell-step-up"]]},
{name:"3. Controle excêntrico e descidas",time:"9 min",items:[
["Descida excêntrica de step (step-down)","3×8 cada perna","Desça em 3–4s controlados; joelho alinhado com o pé","https://education.instepphysio.ca/Injuries-Conditions/Knee/Exercises/Steps-downs/a~1087/article.html"],
["Avanço lateral (lateral lunge)","3×10 cada lado","Com ou sem halter; trabalha abdutor e adutor","https://planfit.ai/lunge-vs-side-lunge"],
["Elevação de panturrilha unilateral","3×12 cada perna","Estabilidade de tornozelo para terreno irregular","https://planfit.ai/en/exercise/calf-raise"]]},
{name:"4. Core forte e resistente",time:"8 min",items:[
["Prancha frontal","45–60s","Resistência, não força máxima","https://planfit.ai/en/exercise/plank"],
["Prancha lateral com elevação de quadril","30–45s cada lado","", "https://planfit.ai/en/exercise/side-plank"],
["Dead bug","12 cada lado","", "https://www.healthline.com/health/exercise-fitness/dead-bug-exercise"],
["Remada prancha alternada (renegade row) com halteres","10 cada lado","", "https://gymkee.com/exercises/lats/renegade-row/"],
["Pallof press (anti-rotação, com halter ou faixa)","10 cada lado","", "https://www.exercise.com/exercises/pallof-press/"],
["Mountain climbers","30–45s","", "https://gymkee.com/exercises/abs/mountain-climber/"]]},
{name:"Volta à calma",time:"4 min",items:[
["Alongamento de flexor de quadril (kneeling)","30s cada lado","", "https://planfit.ai/en/exercise/crossover-kneeling-hip-flexor-stretch"],
["Alongamento de glúteo (figura 4)","30s cada lado","", "https://www.sportsinjuryclinic.net/rehabilitation-exercises/gluteal-figure-4-stretch"],
["Alongamento de TFL/banda iliotibial em pé","30s cada lado","", "https://library.theprehabguys.com/vimeo-video/standing-tfl-and-itb-stretch/"],
["Alongamento de panturrilha na parede","20s cada lado","", "https://eat-move-save.extension.illinois.edu/move/exercise/wall-calf-stretch"],
["Respiração diafragmática","1 min","", ""]]}
];
const exercises=blocks.flatMap((b,bi)=>b.items.map(x=>({block:b.name,blockIndex:bi,name:x[0],dose:x[1],note:x[2],video:x[3]})));
let idx=0,done=new Set(),seconds=0,timer=null;

function renderHome(){
 document.getElementById("blocks").innerHTML=blocks.map((b,bi)=>`
 <div class="block"><div class="blockHead"><div><strong>${b.name}</strong><br><small>${b.items.length} exercícios · ${b.time}</small></div><small>›</small></div>
 <div class="exercises">${b.items.map((x,i)=>`<div class="exercise ${done.has(blocks.slice(0,bi).reduce((a,z)=>a+z.items.length,0)+i)?'done':''}">
 <div class="num">${i+1}</div><div><div class="exName">${x[0]}</div><div class="meta">${x[1]}</div></div></div>`).join("")}</div></div>`).join("");
}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active")}
function showHome(){stopTimer();renderHome();show("home")}
function startWorkout(){idx=0;show("workout");renderExercise()}
function renderExercise(){
 const e=exercises[idx]; currentSet=1; document.getElementById("blockName").textContent=e.block;
 document.getElementById("exName").textContent=e.name;document.getElementById("dose").textContent=e.dose;
 document.getElementById("demoIcon").textContent=icons[idx%icons.length];
 document.getElementById("demoLabel").textContent=e.name;
 renderSets();
 document.getElementById("note").textContent=e.note||"Execute com controle e boa técnica.";
 const v=document.getElementById("video"); if(e.video){v.href=e.video;v.style.display="block"}else v.style.display="none";
 document.getElementById("counter").textContent=`${idx+1}/${exercises.length}`;
 document.getElementById("progress").style.width=((idx+1)/exercises.length*100)+"%";
 seconds=0;updateTimer();stopTimer();document.getElementById("timerLabel").textContent=done.has(idx)?"Concluído":"Pronto";
 document.getElementById("timerBtn").textContent="▶ Timer"; loadWeight();
}
function updateTimer(){let m=String(Math.floor(seconds/60)).padStart(2,"0"),s=String(seconds%60).padStart(2,"0");document.getElementById("timer").textContent=`${m}:${s}`}
function toggleTimer(){if(timer){stopTimer();document.getElementById("timerLabel").textContent="Pausado";return}document.getElementById("timerLabel").textContent="Em execução";timer=setInterval(()=>{seconds++;updateTimer()},1000);document.getElementById("timerBtn").textContent="Ⅱ Pausar"}
function stopTimer(){if(timer){clearInterval(timer);timer=null}document.getElementById("timerBtn").textContent="▶ Timer"}
function completeExercise(){
 markSet();
 const total=exerciseSetCount(exercises[idx]);
 const completed=Object.keys(saved.sets||{}).filter(k=>k.startsWith(idx+"-") && saved.sets[k]).length;
 if(completed<total){document.getElementById("timerLabel").textContent=`Série ${completed+1} de ${total}`;return}
 done.add(idx);persist();stopTimer();document.getElementById("timerLabel").textContent="Concluído ✓";setTimeout(()=>{if(idx<exercises.length-1){idx++;renderExercise()}else{
 saved.sessions.push({date:new Date().toISOString(),completed:exercises.length});
 saved.done=[];saved.sets={};saved.reps={};done.clear(); persist(); alert("Treino concluído! 🎉"); showHome()
}},250)}
function nextExercise(){if(idx<exercises.length-1){idx++;renderExercise()}}
function prevExercise(){if(idx>0){idx--;renderExercise()}}

const STORAGE_KEY="trailStrengthV2";
let saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{"done":[],"weights":{},"reps":{},"sets":{},"sessions":[]}');
done=new Set(saved.done||[]);


let currentSet=1;
const exerciseSetCount = (e)=>{
  const m=(e.dose||"").match(/(\d+)\s*[×x]\s*(\d+)/i);
  return m ? Math.min(parseInt(m[1]),5) : 1;
};
const exerciseReps = (e)=>{
  const m=(e.dose||"").match(/[×x]\s*(\d+)/i);
  if(m) return parseInt(m[1]);
  const m2=(e.dose||"").match(/(\d+)\s*(?:cada|reps?)/i);
  return m2 ? parseInt(m2[1]) : null;
};
const icons=["🦵","🏋️","🧘","🏃","💪","🧍","🦶","🔥"];
function renderSets(){
  const e=exercises[idx], n=exerciseSetCount(e), grid=document.getElementById("setGrid");
  grid.innerHTML=Array.from({length:n},(_,i)=>{
    const s=i+1, key=`${idx}-${s}`, isDone=saved.sets?.[key];
    return `<button class="setBtn ${isDone?'done':''} ${s===currentSet?'active':''}" onclick="selectSet(${s})">${isDone?'✓ ':''}Série ${s}</button>`;
  }).join("");
}
function selectSet(s){
  currentSet=s; renderSets();
  const e=exercises[idx], reps=exerciseReps(e);
  document.getElementById("repsDone").value=(saved.reps?.[`${idx}-${s}`] ?? (reps||""));
  toast(`Série ${s} selecionada`);
}
function saveReps(){
  if(!saved.reps)saved.reps={};
  const v=document.getElementById("repsDone").value;
  if(v!=="")saved.reps[`${idx}-${currentSet}`]=v;
  persist();
}
function markSet(){
  if(!saved.sets)saved.sets={};
  saved.sets[`${idx}-${currentSet}`]=true;
  saveReps(); persist(); renderSets();
  if(navigator.vibrate)navigator.vibrate(70);
  const total=exerciseSetCount(exercises[idx]);
  if(currentSet<total){currentSet++;renderSets();document.getElementById("timerLabel").textContent="Próxima série";startRest();}
  else{document.getElementById("timerLabel").textContent="Todas as séries ✓";}
}

function persist(){
 saved.done=[...done]; localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));
}
function saveWeight(){
 const val=document.getElementById("weight").value;
 if(val==="") delete saved.weights[idx]; else saved.weights[idx]=val;
 persist(); toast("Carga salva");
}
function loadWeight(){
 document.getElementById("weight").value=saved.weights[idx]||"";
}
function toast(msg){
 const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),1600);
}
let restTimer=null, restSeconds=0;
function startRest(){
 clearInterval(restTimer);restSeconds=60;document.getElementById("restText").textContent="Descanso: 01:00";
 restTimer=setInterval(()=>{
   restSeconds--; let m=String(Math.floor(restSeconds/60)).padStart(2,"0"),s=String(restSeconds%60).padStart(2,"0");
   document.getElementById("restText").textContent=`Descanso: ${m}:${s}`;
   if(restSeconds<=0){clearInterval(restTimer);document.getElementById("restText").textContent="Descanso concluído ✓"; if(navigator.vibrate) navigator.vibrate([180,80,180]);}
 },1000);
}
function resetWorkout(){
 done.clear();saved.done=[];persist();renderHome();toast("Sessão reiniciada");
}
function showHistory(){
 const el=document.getElementById("historyScreen");
 const rows=Object.keys(saved.weights).map(i=>`<div class="historyRow"><span>${exercises[i]?.name||"Exercício"}</span><b>${saved.weights[i]} kg</b></div>`).join("");
 el.className="history";el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>Cargas registradas</b><button onclick="hideHistory()" style="background:#eee;border-radius:9px;padding:7px 10px">Fechar</button></div><div style="margin-top:8px">${rows||'<div class="empty">Ainda não há cargas registradas.</div>'}</div>`;
}
function hideHistory(){document.getElementById("historyScreen").className="hidden"}

renderHome();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
